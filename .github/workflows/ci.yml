name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/security-remediation-followup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-crm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (history included)
        working-directory: .
        shell: pwsh
        run: |
          $scanner = ./scripts/install-gitleaks.ps1
          & $scanner git --redact=100 --log-opts='--all' --no-banner .
          exit $LASTEXITCODE

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexus-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://localhost:54269
          VITE_AUTH_MODE: backend
          VITE_AUTH_PROVIDER: auth0
          VITE_DATA_MODE: backend
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Build CRM image
        run: docker build -f nexus-crm/Dockerfile --build-arg VITE_API_BASE_URL=https://api20-hml.wassis.com.br --build-arg VITE_AUTH_PROVIDER=auth0 --build-arg VITE_BUILD_SHA=${{ github.sha }} -t wassis-crm:${{ github.sha }} .
        working-directory: .

      - name: Scan CRM image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wassis-crm:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wassis-crm-dist
          path: nexus-crm/dist
