name: Publish CRM Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wassis-erp/wassis-crm
  HML_API_BASE_URL: https://api20-hml.wassis.com.br
  PROD_API_BASE_URL: https://api20.wassis.com.br
  HML_CRM_BASE_URL: https://crm20-hml.wassis.com.br
  PROD_CRM_BASE_URL: https://crm20.wassis.com.br

jobs:
  publish:
    name: Build, Push and Redeploy CRM Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        env:
          HML_WEBHOOK_URL: ${{ secrets.PORTAINER_CRM_HML_WEBHOOK_URL }}
          PROD_WEBHOOK_URL: ${{ secrets.PORTAINER_CRM_PROD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "prod" ]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              echo "api_base_url=${PROD_API_BASE_URL}" >> "$GITHUB_OUTPUT"
              echo "health_url=${PROD_CRM_BASE_URL}" >> "$GITHUB_OUTPUT"
              echo "webhook_url=${PROD_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=hml" >> "$GITHUB_OUTPUT"
              echo "api_base_url=${HML_API_BASE_URL}" >> "$GITHUB_OUTPUT"
              echo "health_url=${HML_CRM_BASE_URL}" >> "$GITHUB_OUTPUT"
              echo "webhook_url=${HML_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=hml" >> "$GITHUB_OUTPUT"
            echo "api_base_url=${{ env.HML_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "health_url=${{ env.HML_CRM_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "webhook_url=${HML_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nexus-crm/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.meta.outputs.api_base_url }}
            VITE_AUTH_MODE=backend
            VITE_DATA_MODE=backend
            VITE_BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Portainer service redeploy
        env:
          WEBHOOK_URL: ${{ steps.meta.outputs.webhook_url }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Portainer webhook secret is not configured for the selected environment."
            exit 1
          fi

          separator='?'
          case "$WEBHOOK_URL" in
            *\?*) separator='&' ;;
          esac

          response_file="$(mktemp)"
          set +e
          status_code="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 240 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${WEBHOOK_URL}${separator}tag=${IMAGE_TAG}")"
          curl_exit_code=$?
          set -e

          response_body="$(cat "$response_file")"
          rm -f "$response_file"
          printf '%s\n' "$response_body"

          {
            echo "### Portainer redeploy"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Webhook response: HTTP ${status_code:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$curl_exit_code" -ne 0 ]; then
            echo "::error::Could not reach the Portainer service webhook after retries (curl exit ${curl_exit_code}). Verify public HTTPS availability and retry the workflow."
            exit 1
          fi

          case "$status_code" in
            2??)
              ;;
            *)
            case "$response_body" in
              *unauthorized*|*Unauthorized*)
                echo "::error::Portainer reached the service webhook but GHCR rejected the image pull. Configure the ghcr.io registry on the Portainer endpoint with a GitHub user and a token that has read:packages, then associate that registry credential with the service."
                ;;
              *)
                echo "::error::Expected a successful HTTP 2xx response from the Portainer service webhook, received ${status_code}. Verify the service webhook URL and the image tag."
                ;;
            esac
            exit 1
              ;;
          esac

      - name: Verify deployed CRM
        env:
          HEALTH_URL: ${{ steps.meta.outputs.health_url }}
        run: |
          for attempt in $(seq 1 18); do
            response_body="$(curl --fail --silent --show-error --location --max-time 10 "${HEALTH_URL}?build=${GITHUB_SHA}" || true)"
            if printf '%s' "$response_body" | grep --fixed-strings --quiet "content=\"${GITHUB_SHA}\""; then
              echo "CRM build ${GITHUB_SHA} is healthy at ${HEALTH_URL}."
              exit 0
            fi
            echo "Waiting for CRM redeploy (${attempt}/18)..."
            sleep 5
          done
          echo "::error::CRM did not become healthy after the Portainer redeploy."
          exit 1
